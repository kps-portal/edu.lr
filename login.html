<!DOCTYPE html>
<html lang="en">
<head>
<meta name="description" content="Official student and staff login portal for Kingsville Public High School (KPS).">
<meta name="robots" content="index, follow">
<meta charset="UTF-8">
<title>Kingsville Public High School â€” Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --crimson:#c8102e;
    --crimson-dark:#8f0b20;
    --navy:#122148;
    --navy-deep:#0b1730;
    --gold:#f2a71b;
    --ink:#20242e;
    --muted:#7a7f8a;
    --line:#e3e2df;
    --danger:#c0392b;
    --ok:#1e8449;
    --panel:#f6f6f5;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif;}
  html{height:100%;}
  body{
    background:var(--panel);
    min-height:100vh;
    min-height:100dvh;
    display:flex;flex-direction:column;color:var(--ink);
    overflow-x:hidden;
  }

  /* ===== Slim top bar â€” brand only, nothing else ===== */
  header.topbar{
    background:linear-gradient(90deg,var(--navy-deep) 0%,var(--navy) 100%);
    color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:clamp(6px,1.2vh,9px) clamp(12px,4vw,22px);
    border-bottom:2px solid var(--gold);
    flex-shrink:0;
  }
  header.topbar .left{display:flex;align-items:center;gap:10px;}
  header.topbar .left img{height:28px;width:28px;object-fit:contain;border-radius:50%;background:#fff;padding:1px;box-shadow:0 0 0 1px var(--gold);}
  header.topbar .left b{font-weight:800;font-size:13.5px;letter-spacing:1.1px;}
  header.topbar .moe-mini{height:26px;width:26px;object-fit:contain;border-radius:50%;background:#fff;padding:1px;}

  /* ===== Centered single login card ===== */
  main{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:clamp(10px,3vh,30px) 16px;
    min-height:0;
    overflow-y:auto;
  }
  .card{
    width:100%;max-width:400px;background:#fff;border-radius:12px;
    box-shadow:0 18px 45px rgba(11,23,48,.16),0 2px 8px rgba(11,23,48,.08);
    border:1px solid var(--line);
    overflow:hidden;
    max-height:100%;
    animation:cardRise .6s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardRise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .card .accent{height:6px;background:linear-gradient(90deg,var(--crimson) 0%,var(--gold) 100%);}
  .card .body{padding:clamp(18px,4vh,38px) clamp(20px,7vw,36px) clamp(16px,3vh,30px);text-align:center;}
  .seal-stage{position:relative;width:clamp(84px,16vh,150px);height:clamp(84px,16vh,150px);margin:0 auto clamp(8px,2vh,16px);display:flex;align-items:center;justify-content:center;}
  .seal-glow{
    position:absolute;inset:-18px;border-radius:50%;
    background:radial-gradient(circle, rgba(242,167,27,.45) 0%, rgba(200,16,46,.18) 45%, transparent 72%);
    filter:blur(7px);
    animation:sealPulseGlow 3.4s ease-in-out infinite;
  }
  .seal-ring{
    position:absolute;inset:-8px;border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold), #fff3d6, var(--crimson), var(--gold), var(--crimson), #fff3d6, var(--gold));
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
    animation:sealRotateRing 7s linear infinite;
  }
  .card img.seal{
    position:relative;z-index:2;height:clamp(66px,12.6vh,118px);width:clamp(66px,12.6vh,118px);object-fit:contain;border-radius:50%;
    background:#fff;padding:4px;
    box-shadow:0 12px 26px rgba(11,23,48,.28), 0 0 0 4px #fff;
    animation:sealEntrance .9s cubic-bezier(.2,.8,.2,1);
  }
  .seal-shine{
    position:absolute;z-index:3;inset:4px;border-radius:50%;overflow:hidden;pointer-events:none;
  }
  .seal-shine::after{
    content:"";position:absolute;top:-60%;left:-60%;width:40%;height:220%;
    background:linear-gradient(75deg, transparent 40%, rgba(255,255,255,.85) 50%, transparent 60%);
    animation:sealShineSweep 3.6s ease-in-out infinite;
    animation-delay:1s;
  }
  @keyframes sealPulseGlow{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:1;transform:scale(1.1);}}
  @keyframes sealRotateRing{to{transform:rotate(360deg);}}
  @keyframes sealEntrance{from{opacity:0;transform:scale(.6) rotate(-10deg);}to{opacity:1;transform:scale(1) rotate(0);}}
  @keyframes sealShineSweep{0%{left:-60%;}30%{left:130%;}100%{left:130%;}}
  .card h1{
    font-size:clamp(14.5px,3vh,16.5px);color:var(--navy);font-weight:700;line-height:1.45;margin-bottom:6px;letter-spacing:.2px;
  }
  .card h1 .school-line{color:var(--crimson);font-size:clamp(13px,2.7vh,15px);}
  .card .subtitle-rule{width:46px;height:3px;background:var(--gold);margin:clamp(8px,2vh,14px) auto clamp(12px,3vh,22px);border-radius:2px;}
  .field{margin-bottom:clamp(10px,2vh,14px);text-align:left;}
  .field input{
    width:100%;padding:clamp(9px,1.6vh,11px) 13px;border:1px solid var(--line);border-radius:4px;
    font-size:16px;background:#fff;color:var(--ink);
  }
  .field input:focus{outline:none;border-color:var(--crimson);}
  .field input::placeholder{color:#9a9ea6;}

  .captcha-box{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:1px solid var(--line);border-radius:4px;background:#fafafa;
    padding:clamp(7px,1.6vh,10px) 12px;margin:clamp(10px,2vh,16px) 0;
  }
  .captcha-left{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#333;}
  .captcha-left input[type="checkbox"]{width:18px;height:18px;accent-color:var(--crimson);}
  .captcha-badge{font-size:10px;color:#9a9ea6;line-height:1.2;text-align:center;}

  button#loginBtn{
    width:100%;padding:clamp(10px,1.8vh,12px);border:none;border-radius:4px;
    background:var(--crimson);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;
    transition:background .15s;
  }
  button#loginBtn:hover{background:var(--crimson-dark);}
  button#loginBtn:disabled{opacity:.6;cursor:not-allowed;}

  .divider{display:flex;align-items:center;gap:10px;margin:clamp(10px,2.2vh,18px) 0 clamp(8px,1.6vh,14px);color:#b3b6bc;font-size:11px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

  button#msBtn{
    width:100%;padding:clamp(8px,1.6vh,10px);border:1px solid var(--line);border-radius:4px;
    background:#fff;font-weight:600;font-size:13.5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;color:#333;
  }
  button#msBtn:hover{background:#fafafa;}
  .ms-logo{width:16px;height:16px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;}
  .ms-logo i{display:block;}
  .ms-logo i:nth-child(1){background:#f25022;}
  .ms-logo i:nth-child(2){background:#7fba00;}
  .ms-logo i:nth-child(3){background:#00a4ef;}
  .ms-logo i:nth-child(4){background:#ffb900;}

  a.forgot{
    display:block;margin-top:clamp(10px,2vh,16px);font-size:13px;color:var(--navy);text-decoration:none;font-weight:600;
  }
  a.forgot:hover{text-decoration:underline;}

  .msg{margin-top:clamp(8px,1.6vh,14px);font-size:12.5px;padding:9px 11px;border-radius:4px;display:none;text-align:left;}
  .msg.err{display:block;background:#fdecea;color:var(--danger);border:1px solid #f6c9c4;}
  .msg.ok{display:block;background:#eafaf1;color:var(--ok);border:1px solid #b9e6c9;}

  footer.site-footer{
    background:var(--navy-deep);
    color:#c9d2e8;font-size:11px;text-align:center;padding:clamp(8px,1.4vh,12px) 10px;
    border-top:2px solid var(--gold);
    flex-shrink:0;
  }
  footer.site-footer .footer-line-1{font-weight:600;letter-spacing:.2px;}
  footer.site-footer .footer-line-2{margin-top:3px;font-size:10.5px;color:var(--gold);letter-spacing:.3px;}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-api.js"></script>
<script src="js/kps-core.js"></script>
<script src="js/module-registry.js"></script>
<script src="js/permissions.js"></script>
<script src="js/relationships.js"></script>
<script src="js/workflow.js"></script>
<script src="js/forms.js"></script>
<script src="js/app.js"></script>
<script src="js/erp-engine-v4.js"></script>


<header class="topbar">
<meta name="description" content="Official student and staff login portal for Kingsville Public High School (KPS).">
<meta name="robots" content="index, follow">
  <div class="left" id="topbarCrestWrap"><b>KINGSVILLE PUBLIC HIGH SCHOOL</b></div>
  <img class="moe-mini" src="assets/images/img-c4fe6fce0514ab8d.png" alt="Ministry of Education seal">
</header>

<main>
  <div class="card">
    <div class="accent"></div>
    <div class="body">
      <div class="seal-stage">
        <div class="seal-glow"></div>
        <div class="seal-ring"></div>
        <img class="seal" src="assets/images/img-382a5ec339393563.png" alt="School seal">
        <div class="seal-shine"></div>
      </div>
      <h1>School Management Portal<br><span class="school-line">Kingsville Public High School</span></h1>
      <div class="subtitle-rule"></div>

      <div class="field">
        <input id="loginId" type="text" placeholder="Username or ID" autocomplete="username">
      </div>
      <div class="field">
        <input id="password" type="password" placeholder="Enter Password" autocomplete="current-password">
      </div>

      <div class="captcha-box">
        <label class="captcha-left">
          <input type="checkbox" id="notRobot">
          I'm not a robot
        </label>
        <div class="captcha-badge">reCAPTCHA</div>
      </div>

      <button id="loginBtn">Login Now</button>

      <div class="divider">OR</div>
      <button id="msBtn">
        <span class="ms-logo"><i></i><i></i><i></i><i></i></span>
        Sign in with Microsoft
      </button>

      <a class="forgot" href="forgot-password.html">Forgot Password?</a>

      <div class="msg" id="msgBox"></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-line-1">Â© <span id="year"></span> Kingsville Public High School</div>
  <div class="footer-line-2">Developed by Mr. Fomba S. Varfee</div>
</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  const loginBtn = document.getElementById("loginBtn");
  const msgBox   = document.getElementById("msgBox");
  // Staff sign in with their Username, students with their auto-generated
  // ID (e.g. "000001"), either of which can also just be an email address.
  // public.resolve_login_email(...) (see supabase/migrations/
  // 005_addendum_login_identifiers.sql) turns whichever was typed into the
  // real auth email Supabase Auth needs.
  document.getElementById("loginId").placeholder = "Username, Student ID, or Email";
  document.getElementById("loginId").type = "text";
  document.getElementById("loginId").autocomplete = "username";

  function showMsg(text, type) {
    // Defensive: never let a raw object/Error render as "{}" or
    // "[object Object]" â€” always reduce to a readable string, and log
    // the original value so we can see what actually came back.
    if (text && typeof text === "object") {
      console.error("[login] non-string message passed to showMsg:", text);
      text = text.message || text.error_description || text.msg ||
             text.details || text.hint ||
             "Something went wrong signing in. Please try again or contact ICT.";
    }
    msgBox.textContent = text;
    msgBox.className = "msg " + type;
  }

  // If the user was just auto-logged-out for being idle, let them know
  // why instead of silently dropping them back at a blank login form.
  (function showIdleLogoutMessage() {
    let reason = null;
    try {
      reason = sessionStorage.getItem("kps_logout_reason");
      sessionStorage.removeItem("kps_logout_reason");
    } catch (e) { /* ignore */ }
    if (reason === "idle") {
      showMsg("You were signed out automatically after a period of inactivity. Please log in again.", "err");
    }
  })();

  // If already signed in (e.g. returning to login.html directly), send
  // the user straight to their dashboard instead of showing the form.
  (async () => {
    const { user, profile } = await KPS.getSessionProfile();
    if (user && profile && profile.is_active !== false && !profile.must_change_password) {
      const target = await KPS.getUserDashboard();
      if (target) window.location.href = target;
    }
  })();

  // Fire-and-forget: logs the attempt to public.login_history (and, on
  // success, mirrors into public.audit_logs as action='login' via a DB
  // trigger) so super-admin/audit-log.html's "Logins" tab, "Failed logins"
  // and "Active sessions" cards have real data instead of staying empty
  // forever. Never blocks or fails the actual sign-in flow.
  function logAttempt(identifier, success) {
    KPS.db.rpc("record_login_attempt", {
      identifier,
      success,
      user_agent: navigator.userAgent
    }).catch(e => console.warn("[login] record_login_attempt failed (non-fatal):", e));
  }

  async function handleLogin() {
    const identifier = document.getElementById("loginId").value.trim();
    const password   = document.getElementById("password").value;
    msgBox.className = "msg";

    if (!identifier || !password) {
      showMsg("Enter your Username, Student ID, or Email, and your password.", "err");
      return;
    }
    if (!document.getElementById("notRobot").checked) {
      showMsg("Please confirm you're not a robot.", "err");
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Signing inâ€¦";

    let email;
    try {
      email = await KPS.db.rpc("resolve_login_email", { identifier });
    } catch (e) {
      console.error("[login] resolve_login_email failed â€” raw error:", e);
    }
    console.log("[login] resolve_login_email ->", email);
    if (!email) {
      logAttempt(identifier, false);
      showMsg("Username, Student ID, Email, and Password do not match our records.", "err");
      loginBtn.disabled = false; loginBtn.textContent = "Login Now";
      return;
    }

    let result;
    try {
      result = await KPS.login(email, password);
    } catch (e) {
      console.error("[login] KPS.login threw â€” raw error:", e);
      logAttempt(identifier, false);
      showMsg("Sign-in failed unexpectedly. Please try again or contact ICT.", "err");
      loginBtn.disabled = false; loginBtn.textContent = "Login Now";
      return;
    }
    console.log("[login] KPS.login result ->", result);
    logAttempt(identifier, !!result.ok);

    if (!result.ok) {
      showMsg(result.error || "Email and Password do not match our records.", "err");
      loginBtn.disabled = false; loginBtn.textContent = "Login Now";
      return;
    }
    if (result.mustChangePassword) {
      window.location.href = "change-password.html?first=1";
      return;
    }
    window.location.href = result.target;
  }

  // Microsoft OAuth is not part of the current KPS-MIS backend configuration
  // (no azure provider wired in Supabase Auth). Hidden rather than left
  // pointing at a dead flow.
  const msBtn = document.getElementById("msBtn");
  msBtn.style.display = "none";
  document.querySelector(".divider").style.display = "none";

  loginBtn.addEventListener("click", handleLogin);
  document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
  document.getElementById("loginId").addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
</script>
</body>
</html>
